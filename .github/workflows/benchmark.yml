{
  "name": "Verified gait benchmark",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {},
    "workflow_dispatch": {},
    "schedule": [
      {
        "cron": "7 10 * * *"
      }
    ]
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "experiment-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "validate": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Install pinned requirements",
          "run": "python -m pip install -r requirements.txt"
        },
        {
          "name": "Test",
          "run": "python -m unittest discover -s tests -v"
        },
        {
          "name": "Generate and independently recompute artifacts",
          "run": "python pipeline.py\npython pipeline.py --verify"
        },
        {
          "name": "Run summary",
          "run": "cat results/report.md >> \"$GITHUB_STEP_SUMMARY\""
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "verified-results-${{ github.run_id }}",
            "path": "results/",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
